# Configuration for Dependabot to automatically update dependencies
version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Allow both minor and patch version updates
    open-pull-requests-limit: 10
    # Group updates by type
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security-update"
      
  # Monitor GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
